<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Title Google shows in search results -->
  <title>Engineering Queue Management System | Municipality of Naic</title>
  
  <!-- Description Google displays under the title -->
  <meta name="description" content="Official Queue Management System for the Engineering Office, Municipality of Naic, Cavite. View live serving numbers for Regular and Priority lines.">
  <meta name="keywords" content="Queue System: Municipality of Naic - Engineering Office">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="assets/logo.png" alt="Engineering Logo" class="office-logo">
      <div class="office-info">
        <h2>Municipality of Naic - Engineering Office</h2>
        <p>Ibayo Silangan, Naic, Cavite</p>
      </div>
    </div>
    <div class="nav-buttons">
      <a href="controller.html" class="nav-btn outline">Controller</a>
      <a href="display.html" class="nav-btn active">Display</a>
      <button class="nav-btn outline" onclick="toggleFullscreen()">Fullscreen</button>
    </div>
  </header>

  <main>
    <h1 class="display-header-text">Now Serving</h1>

    <div class="grid-container">
      <!-- Regular Line Panel -->
      <div class="panel display-panel">
        <div class="panel-header regular">REGULAR LINE</div>
        <div class="display-panel-body">
          <div id="reg-num-display" class="number-text">-</div>
        </div>
      </div>

      <!-- Priority Line Panel -->
      <div class="panel display-panel">
        <div class="panel-header priority">PRIORITY LINE</div>
        <div class="display-panel-body">
          <div id="prio-num-display" class="number-text">-</div>
        </div>
      </div>
    </div>

    <div class="footer-banner" id="announcement-banner">
      Waiting for the next number...
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
<script>
  // Force websocket transport for instant updates across devices
  const socket = io({ transports: ['websocket', 'polling'] });

  let speechQueue = [];
  let isSpeaking = false;
  let audioUnlocked = false;
  let selectedMaleVoice = null;

  // Search system voices and select a male voice across OS platforms
  function loadMaleVoice() {
    if (!('speechSynthesis' in window)) return;
    
    const voices = window.speechSynthesis.getVoices();
    if (voices.length === 0) return;

    // Look for known system male voice keywords across Windows, Mac, iOS, Android
    const maleKeywords = ['david', 'mark', 'george', 'daniel', 'arthur', 'male', 'google uk english male', 'alex'];

    selectedMaleVoice = voices.find(voice => {
      const nameLower = voice.name.toLowerCase();
      return maleKeywords.some(keyword => nameLower.includes(keyword)) && voice.lang.startsWith('en');
    });

    // Fallback: If no explicit male voice is found by name, pick any English voice
    if (!selectedMaleVoice) {
      selectedMaleVoice = voices.find(v => v.lang.startsWith('en')) || voices[0];
    }
  }

  // Handle asynchronous voice loading in Chrome / Android
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadMaleVoice;
    loadMaleVoice();
  }

  // Unlock Browser Speech API on first user interaction
  document.addEventListener('click', () => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.resume();
      audioUnlocked = true;
    }
  }, { once: true });

  // Unfreeze speech engine if tab was running in the background
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && 'speechSynthesis' in window) {
      window.speechSynthesis.resume();
    }
  });

  function processSpeechQueue() {
    if (isSpeaking || speechQueue.length === 0) return;
    if (!('speechSynthesis' in window)) return;

    isSpeaking = true;
    const nextText = speechQueue.shift();

    window.speechSynthesis.resume();

    const utterance = new SpeechSynthesisUtterance(nextText);
    utterance.rate = 0.9;
    
    // Lower pitch slightly to enforce a deeper male tone on fallback voices
    utterance.pitch = 0.88;

    // Assign the selected male voice object
    if (selectedMaleVoice) {
      utterance.voice = selectedMaleVoice;
    }

    utterance.onend = () => {
      isSpeaking = false;
      setTimeout(processSpeechQueue, 50);
    };

    utterance.onerror = () => {
      isSpeaking = false;
      setTimeout(processSpeechQueue, 50);
    };

    window.speechSynthesis.speak(utterance);
  }

  function speakAnnouncement(text) {
    speechQueue.push(text);
    processSpeechQueue();
  }

  let lastActionTimestamp = null;

  socket.on('stateUpdate', (state) => {
    const regDisplay = document.getElementById('reg-num-display');
    const prioDisplay = document.getElementById('prio-num-display');
    const banner = document.getElementById('announcement-banner');

    // Update Screen Display Numbers Instantly
    if (regDisplay) {
      if (state.regular > 0) {
        regDisplay.innerText = state.regular;
      } else {
        regDisplay.innerText = '-';
      }
    }

    if (prioDisplay) {
      if (state.priority > 0) {
        prioDisplay.innerText = state.priority;
      } else {
        prioDisplay.innerText = '-';
      }
    }

    // Update Screen Banner Text
    let servingParts = [];
    if (state.regular > 0) servingParts.push(`Regular Number ${state.regular}`);
    if (state.priority > 0) servingParts.push(`Priority Number ${state.priority}`);

    if (servingParts.length > 0) {
      banner.innerText = `Now serving ${servingParts.join(' and ')}. Please proceed to the counter.`;
    } else {
      banner.innerText = "Waiting for the next number...";
    }

    // Voice Logic
    if (state.lastCalled && state.lastCalled.timestamp && state.lastCalled.timestamp !== lastActionTimestamp) {
      lastActionTimestamp = state.lastCalled.timestamp;
      const { type, number, action } = state.lastCalled;
      
      let voiceText = "";

      if (action === 'recall') {
        voiceText = `Again, calling for ${type} Number ${number}. Please proceed to the counter.`;
      } else if (action === 'next' || action === 'call') {
        voiceText = `Now serving ${type} Number ${number}. Please proceed to the counter.`;
      }

      if (voiceText) {
        speakAnnouncement(voiceText);
      }
    }
  });
</script>
</body>
</html>
