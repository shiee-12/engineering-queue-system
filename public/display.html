<!DOCTYPE html>
<html>
<head>
  <title>Display Screen | Engineering Office</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="assets/logo.png" alt="Engineering Logo" class="office-logo">
      <div class="office-info">
        <h2>Municipality of Naic - Engineering Office</h2>
        <p>Ibayo Silangan, Naic, Cavite</p>
      </div>
    </div>
    <div class="nav-buttons">
      <a href="controller.html" class="nav-btn outline">Controller</a>
      <a href="display.html" class="nav-btn active">Display</a>
      <button class="nav-btn outline" onclick="toggleFullscreen()">Fullscreen</button>
    </div>
  </header>

  <main>
    <h1 class="display-header-text">Now Serving</h1>

    <div class="grid-container">
      <!-- Regular Line Panel -->
      <div class="panel display-panel">
        <div class="panel-header regular">REGULAR LINE</div>
        <div class="display-panel-body">
          <div id="reg-num-display" class="number-text">-</div>
        </div>
      </div>

      <!-- Priority Line Panel -->
      <div class="panel display-panel">
        <div class="panel-header priority">PRIORITY LINE</div>
        <div class="display-panel-body">
          <div id="prio-num-display" class="number-text">-</div>
        </div>
      </div>
    </div>

    <div class="footer-banner" id="announcement-banner">
      Waiting for the next number...
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let lastStateHash = null;

    function speakAnnouncement(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop current speech if any
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    socket.on('stateUpdate', (state) => {
      // Update Numbers Display
      const regDisplay = document.getElementById('reg-num-display');
      const prioDisplay = document.getElementById('prio-num-display');
      const banner = document.getElementById('announcement-banner');

      if (state.regular > 0) {
        regDisplay.innerHTML = state.regular;
        regDisplay.classList.remove('regular-box');
      } else {
        regDisplay.innerHTML = '<div class="number-box regular-box"></div>';
      }

      if (state.priority > 0) {
        prioDisplay.innerHTML = state.priority;
        prioDisplay.classList.remove('priority-box');
      } else {
        prioDisplay.innerHTML = '<div class="number-box priority-box"></div>';
      }

      // Build text for all active numbers currently being served
      let servingParts = [];
      if (state.regular > 0) {
        servingParts.push(`Regular Number ${state.regular}`);
      }
      if (state.priority > 0) {
        servingParts.push(`Priority Number ${state.priority}`);
      }

      if (servingParts.length > 0) {
        const fullAnnouncement = `Now serving ${servingParts.join(' and ')}. Please proceed to the counter.`;
        
        // Update screen banner
        banner.innerText = fullAnnouncement;

        // Speak both numbers when an update occurs
        if (state.lastCalled) {
          const currentStateHash = JSON.stringify(state);
          if (lastStateHash !== currentStateHash) {
            speakAnnouncement(fullAnnouncement);
            lastStateHash = currentStateHash;
          }
        }
      } else {
        banner.innerText = "Waiting for the next number...";
      }
    });
  </script>
</body>
</html>
