<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

 <script>
  if (!sessionStorage.getItem('active_session')) {
      window.location.replace('/login.html');
    }

  function navigateTo(targetPage) {
    window.location.href = targetPage;
  }
</script>

  <title>Engineering Queuing System | Municipality of Naic</title>
  
  <meta name="description" content="Queuing Management System for the Engineering Office, Municipality of Naic, Cavite. View live serving numbers for Regular and Priority lines.">
  <meta name="keywords" content="Engineering Queuing System">
  <link rel="stylesheet" href="style.css">

  <link rel="prefetch" href="controller.html" as="document">
  <link rel="prefetch" href="display.html" as="document">

  <link rel="preconnect" href="https://cdn.socket.io">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="assets/logo.png" alt="Engineering Logo" class="office-logo">
      <div class="office-info">
        <h2>Municipality of Naic - Engineering Office</h2>
        <p>Ibayo Silangan, Naic, Cavite</p>
      </div>
    </div>
    <div class="nav-buttons">
      <button type="button" class="nav-btn outline" onclick="navigateTo('controller.html')">Controller</button>
      <button type="button" class="nav-btn outline" onclick="navigateTo('display.html')">Display</button>
      <button type="button" class="nav-btn outline" onclick="toggleFullscreen()">Fullscreen</button>
    </div>
  </header>

  <main>
    <h1 class="display-header-text">Now Serving</h1>

    <div class="grid-container">
      <div class="panel display-panel">
        <div class="panel-header regular">REGULAR LINE</div>
        <div class="display-panel-body">
          <div id="reg-num-display" class="number-text">-</div>
        </div>
      </div>

      <div class="panel display-panel">
        <div class="panel-header priority">PRIORITY LINE</div>
        <div class="display-panel-body">
          <div id="prio-num-display" class="number-text">-</div>
        </div>
      </div>
    </div>

    <div class="footer-banner" id="announcement-banner">
      Waiting for the next number...
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io({ transports: ['websocket'], upgrade: false });

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      } else if (document.documentElement.webkitRequestFullscreen) {
        document.documentElement.webkitRequestFullscreen();
      }
      } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  }

  let audioUnlocked = false;

  function initSpeechEngine() {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.getVoices();
    window.speechSynthesis.resume();
  }

  window.addEventListener('DOMContentLoaded', initSpeechEngine);
  window.addEventListener('load', initSpeechEngine);

  function announceNumber(queueType, number, action) {
    if (!('speechSynthesis' in window)) return;

    // Cancel any ongoing speech before starting new call
    window.speechSynthesis.cancel();
    window.speechSynthesis.resume();

    let englishText = "";

    // Format message based on action
    if (action === 'recall') {
      englishText = `Again, calling for ${queueType} Number ${number}. Please proceed to the counter.`;
    } else {
      englishText = `Now serving ${queueType} Number ${number}. Please proceed to the counter.`;
    }

    const utterEnglish = new SpeechSynthesisUtterance(englishText);
    utterEnglish.lang = 'en-US';
    utterEnglish.rate = 1.0;

    window.speechSynthesis.speak(utterEnglish);
  }
 
  let lastActionTimestamp = null;

  socket.on('stateUpdate', (state) => {
    const regDisplay = document.getElementById('reg-num-display');
    const prioDisplay = document.getElementById('prio-num-display');
    const banner = document.getElementById('announcement-banner');

    if (regDisplay) regDisplay.innerText = state.regular > 0 ? state.regular : '-';
    if (prioDisplay) prioDisplay.innerText = state.priority > 0 ? state.priority : '-';

    let servingParts = [];
    if (state.priority > 0) servingParts.push(`Priority Number ${state.priority}`);
    if (state.regular > 0) servingParts.push(`Regular Number ${state.regular}`);

    if (servingParts.length > 0) {
      banner.innerText = `Now serving ${servingParts.join(' and ')}. Please proceed to the counter.`;
    } else {
      banner.innerText = "Waiting for the next number...";
    }

    if (state.lastCalled && state.lastCalled.timestamp && state.lastCalled.timestamp !== lastActionTimestamp) {
      lastActionTimestamp = state.lastCalled.timestamp;
      
      const { type, number, action } = state.lastCalled;

        window.speechSynthesis.resume();
        announceNumber(type, number, action);
      
    }
  });
</script>
</body>
</html>
