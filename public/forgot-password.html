<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password | Municipality of Naic - Engineering Office</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: var(--border-radius);
      border: 1px solid #cbd5e1;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15), 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 35px 30px;
    }

    .login-title {
      color: var(--navy);
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }

    .login-subtitle {
      color: #666;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .form-group label {
      font-weight: bold;
      font-size: 0.85rem;
      color: var(--navy);
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .readonly-input {
      background-color: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    .form-group input:focus:not(.readonly-input) {
      border-color: var(--navy);
    }

    .status-banner {
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      display: none;
    }

    .status-banner.error {
      background-color: #fde8e8;
      color: #dc2626;
      border: 1px solid #dc2626;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 18px;
    }

    .auth-link {
      color: var(--navy);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Header Navbar -->
  <header>
    <div class="logo-container">
      <img src="assets/logo.png" class="office-logo" alt="Logo">
      <div class="office-info">
        <h2>Municipality of Naic - Engineering Office</h2>
        <p>Ibayo Silangan, Naic, Cavite</p>
      </div>
    </div>
  </header>

  <!-- Reset Form Container -->
  <main class="login-wrapper">
    <div class="login-card">
      <h1 class="login-title">Reset Admin Password</h1>
      <p class="login-subtitle">Engineering Office Queuing System</p>

      <div id="status-banner" class="status-banner error"></div>

      <form action="/api/reset-password" method="POST">
        <div class="form-group">
          <label for="username">System Username</label>
          <input type="text" id="username" name="username" value="naic_engineering" readonly class="readonly-input" required>
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" class="form-input" required minlength="6">
        </div>

        <button type="submit" class="btn btn-navy login-btn">Update Password</button>

        <div class="auth-footer">
          <a href="/login.html" class="auth-link">← Back to Login</a>
        </div>
      </form>
    </div>
  </main>

  <script>
    // Read URL query parameters to show status banners
    const urlParams = new URLSearchParams(window.location.search);
    const errorParam = urlParams.get('error');
    const banner = document.getElementById('status-banner');

    if (errorParam) {
      banner.style.display = 'block';
      if (errorParam === 'weak_password') {
        banner.innerText = 'Password must be at least 6 characters long.';
      } else if (errorParam === 'invalid_user') {
        banner.innerText = 'Invalid username specified for reset.';
      } else if (errorParam === 'server_error') {
        banner.innerText = 'Server error encountered. Please try again.';
      } else {
        banner.innerText = 'Failed to update password. Please try again.';
      }
    }
  </script>
</body>
</html>
