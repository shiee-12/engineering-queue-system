<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <!-- Shared Header -->
  <header class="main-header">
    <div class="logo-container">
      <img src="assets/logo.png" alt="Engineering Logo" class="office-logo">
      <div class="office-info">
        <h2>Municipality of Naic - Engineering Office</h2>
        <p>Ibayo Silangan, Naic, Cavite</p>
      </div>
    </div>
  </header>
  <div class="header-accent-line"></div>

  <!-- Form Container -->
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Reset Admin Password</h2>
        <p>Engineering Office Queuing System</p>
      </div>

      <form action="/api/reset-password" method="POST" class="auth-form">
        <div class="form-group">
          <label for="username">System Username</label>
          <input type="text" id="username" name="username" value="naic_engineering" readonly class="form-input readonly-input" required>
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" class="form-input" required minlength="6">
        </div>

        <button type="submit" class="auth-btn">Update Password</button>

        <div class="auth-footer">
          <a href="/login.html" class="auth-link">← Back to Login</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
