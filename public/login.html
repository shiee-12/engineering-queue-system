<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <!-- Title Google shows in search results -->
  <title>Engineering Queuing System | Municipality of Naic</title>
  
  <!-- Description Google displays under the title -->
  <meta name="description" content="Queuing Management System for the Engineering Office, Municipality of Naic, Cavite. View live serving numbers for Regular and Priority lines.">
  <meta name="keywords" content="Engineering Queuing System">
  <link rel="stylesheet" href="style.css">

  <!-- Prefetch opposite page for instant switching -->
  <link rel="prefetch" href="controller.html" as="document">
  <link rel="prefetch" href="display.html" as="document">

  <!-- Pre-connect to Socket.io resources -->
  <link rel="preconnect" href="https://cdn.socket.io">

  <style>
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: var(--border-radius);
      border: 1px solid #cbd5e1;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15), 0 4px 10px rgba(0, 0, 0, 0.1);;
      padding: 35px 30px;
    }

    .login-title {
      color: var(--navy);
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }

    .login-subtitle {
      color: #666;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .form-group label {
      font-weight: bold;
      font-size: 0.85rem;
      color: var(--navy);
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--navy);
    }

    .error-banner {
      background-color: #fde8e8;
      color: var(--red);
      border: 1px solid var(--red);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      display: none;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
    }

    .success-banner {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- Header Navbar -->
  <header>
    <div class="logo-container">
      <img src="assets/logo.png" class="office-logo" alt="Logo">
      <div class="office-info">
        <h2>Municipality of Naic - Engineering Office</h2>
        <p>Ibayo Silangan, Naic, Cavite</p>
      </div>
    </div>
  </header>

  <!-- Login Form Container -->
  <main class="login-wrapper">
    <div class="login-card">
      <h1 class="login-title">Admin Login</h1>
      <p class="login-subtitle">Engineering Office Queuing System</p>

      <div id="error-banner" class="error-banner">
        Invalid username or password. Please try again.
      </div>

      <form action="/api/login" method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" class="form-input" required>
          <div class="forgot-wrapper">
            <a href="/forgot-password.html" class="forgot-link">Forgot Password?</a>
          </div>
        </div>

        <button type="submit" class="btn btn-navy login-btn">Sign In</button>
      </form>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);

  // Check for error status
  if (urlParams.get('error') === 'invalid') {
    const errorBanner = document.getElementById('error-banner');
    if (errorBanner) errorBanner.style.display = 'block';
  }

  // Check for password reset success
  if (urlParams.get('reset') === 'success') {
    const successBanner = document.getElementById('success-banner');
    if (successBanner) {
      successBanner.style.display = 'block';
    }
  }

  const loginForm = document.querySelector('form');
  if (loginForm) {
    loginForm.addEventListener('submit', () => {
      sessionStorage.setItem('active_session', 'true');
    });
  }
  // Display reset success banner on login page
if (urlParams.get('reset') === 'success') {
  const errorBanner = document.getElementById('error-banner');
  if (errorBanner) {
    errorBanner.style.display = 'block';
    errorBanner.style.backgroundColor = '#def7ec';
    errorBanner.style.color = '#03543f';
    errorBanner.style.borderColor = '#84e1bc';
    errorBanner.innerText = 'Password updated successfully! Log in with your new password.';
  }
}
</script>
</body>
</html>
